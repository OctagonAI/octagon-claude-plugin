name: Validate Plugin

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate Claude plugin manifest when Claude CLI is available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "Claude CLI is not installed in this runner. Run 'claude plugin validate .' as part of release validation."
          fi
